<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CineAI favicon</title>
  <desc id="desc">A custom icon combining a film reel, stylized A, and AI circuit lines.</desc>
  <defs>
    <linearGradient id="ring" x1="18" y1="18" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee7f5" />
      <stop offset="0.55" stop-color="#2d7ff9" />
      <stop offset="1" stop-color="#844bff" />
    </linearGradient>
    <linearGradient id="panel" x1="24" y1="24" x2="76" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d3f86" />
      <stop offset="1" stop-color="#1d1f5a" />
    </linearGradient>
    <linearGradient id="accent" x1="42" y1="30" x2="84" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bf8ff" />
      <stop offset="0.48" stop-color="#4db6ff" />
      <stop offset="1" stop-color="#925bff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="leftHalf">
      <path d="M64 18a46 46 0 1 0 0 92V18Z" />
    </clipPath>
  </defs>

  <circle cx="64" cy="64" r="54" fill="#f8fbff" />
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="4.5" />

  <g clip-path="url(#leftHalf)">
    <circle cx="64" cy="64" r="42" fill="url(#panel)" />
    <circle cx="46" cy="44" r="8.5" fill="#ffffff" opacity="0.92" />
    <circle cx="43" cy="70" r="8.5" fill="#ffffff" opacity="0.92" />
    <circle cx="64" cy="30" r="8.5" fill="#ffffff" opacity="0.92" />
    <circle cx="63" cy="98" r="8.5" fill="#ffffff" opacity="0.92" />
    <path d="M39 44c4.5-2.5 9.5-3 14.5-2" stroke="#4eb1ff" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />
    <path d="M36 70c4.5-2.4 9.8-2.9 14.8-1.8" stroke="#4eb1ff" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />
    <path d="M57.5 30c4.8-1.8 9.8-1.8 14.4 0" stroke="#4eb1ff" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />
    <path d="M56.8 98c4.8-1.6 9.8-1.6 14.4 0" stroke="#4eb1ff" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />
  </g>

  <path
    d="M29 88c8-6.6 11.7-12.8 16.6-26.5c4.7-12.9 11.2-20.7 20-20.7c8.9 0 15.2 5.9 15.2 14.3
    c0 2.6-.6 5.3-1.6 8.1c5.8 1.5 10.8 4.6 15.5 9.7"
    fill="none"
    stroke="url(#accent)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <path
    d="M45.5 83.5h33.5"
    stroke="url(#accent)"
    stroke-width="6.5"
    stroke-linecap="round"
